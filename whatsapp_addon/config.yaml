name: Whatsapp (Lodge)
version: "1.8.0"
slug: whatsapp_addon
description: Send and receive WhatsApp messages from Home Assistant (self-healing fork)
url: "https://github.com/pug306d/ha-addons/tree/main/whatsapp_addon"
homeassistant_api: true
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
init: false
map:
  - config:rw
options:
  clients:
    - default
  baileys_log_level: error
schema:
  clients:
    - str
  baileys_log_level: list(silent|fatal|error|warn|info|debug)?
